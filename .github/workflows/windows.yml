name: Windows x64

on:
  push:
    branches: [ main, master, dev, arena/* ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!docs/building-win.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.sh'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  windows-x64:
    name: Windows x64 (${{ inputs.build_type || 'Debug' }})
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    env:
      UPLOAD_ARTIFACT: "true"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | head -n 1 | sed -r 's/.*\*\*([0-9.]+)\*\* SDK version.*/\\1/')"
          if [ -z "$SDK" ]; then
            SDK="10.0.26100.0"
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "CACHE_KEY=$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "GitHub Actions"
          echo "SDK detected: $SDK"
          BUILD_TYPE="${{ inputs.build_type || 'Debug' }}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          if [ "$BUILD_TYPE" = "Debug" ]; then
            echo "PREPARE_ARGS=skip-release silent" >> $GITHUB_ENV
          else
            echo "PREPARE_ARGS=silent" >> $GITHUB_ENV
          fi

      - name: Native Tools Command Prompt.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-x64-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_\-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_\-]*
          key: ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            ${{ runner.os }}-x64-libs-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-x64-libs-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_\-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_\-]*
          key: ${{ runner.os }}-x64-qt-${{ env.CACHE_KEY }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            ${{ runner.os }}-x64-qt-${{ env.CACHE_KEY }}-
            ${{ runner.os }}-x64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat %PREPARE_ARGS%

      - name: Free up some disk space.
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Telegram Desktop build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}
          cmake --build ..\out --config %BUILD_TYPE% --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_TYPE%
          mkdir artifact
          dir %OUT%
          if exist %OUT%\YoriGram.exe (
            move %OUT%\YoriGram.exe artifact\
          ) else (
            echo YoriGram.exe not found, checking Telegram.exe fallback
            if exist %OUT%\Telegram.exe move %OUT%\Telegram.exe artifact\YoriGram.exe
          )
          if exist %OUT%\Updater.exe move %OUT%\Updater.exe artifact\

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: YoriGram-Desktop-Windows-x64-${{ env.BUILD_TYPE }}
          path: artifact\
          if-no-files-found: error

      - name: Upload YoriGram.exe only.
        uses: actions/upload-artifact@v4
        with:
          name: YoriGram.exe-${{ env.BUILD_TYPE }}
          path: artifact/YoriGram.exe
          if-no-files-found: error
